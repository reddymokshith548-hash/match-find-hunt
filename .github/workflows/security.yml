name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Audit production dependencies (high & critical)
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          node -e '
            const fs = require("fs");
            let r;
            try { r = JSON.parse(fs.readFileSync("audit.json", "utf8")); }
            catch { console.log("::warning::audit output unavailable (registry error) - skipping"); process.exit(0); }
            if (r.error) { console.log("::warning::npm audit endpoint error - skipping"); process.exit(0); }
            const v = (r.metadata && r.metadata.vulnerabilities) || {};
            const bad = (v.high || 0) + (v.critical || 0);
            for (const [name, a] of Object.entries(r.vulnerabilities || {})) {
              if (["high", "critical"].includes(a.severity)) {
                console.log(`${a.severity.toUpperCase()}: ${name} (${a.range}) -> fix: ${a.fixAvailable ? "available" : "none"}`);
              }
            }
            if (bad > 0) { console.log(`::error::${bad} high/critical vulnerabilities found`); process.exit(1); }
            console.log("No high or critical vulnerabilities.");
          '

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest detect \
            --source=/repo --redact --no-banner --exit-code 1

  codeql:
    name: CodeQL static analysis (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    # CodeQL upload requires GitHub Advanced Security (free on public repos).
    # Keep it informational so a disabled-GHAS repo does not block the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  zap-baseline:
    name: OWASP ZAP baseline scan (published site)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "https://lexach.com"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a -I"
